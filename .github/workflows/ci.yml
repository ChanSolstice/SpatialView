name: CI

on:
  push:
    branches: [main, dev, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: APP（lint、类型检查、测试、构建）
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python 工具（ruff、pytest）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.12.21'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  ros:
    name: ROS 2 包（构建、mock 自测）
    runs-on: ubuntu-24.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y --no-install-recommends python3-numpy
      - run: cd ros2_ws && source /opt/ros/humble/setup.bash && colcon build
      - run: |
          source ros2_ws/install/setup.bash
          python3 -c "from spatialview_msgs.msg import SystemState; assert SystemState.INTERFACE_VERSION == '1.0'"
      - run: python3 -m tools.sample_data --size small
      - run: scripts/mock-selftest.sh --inside
