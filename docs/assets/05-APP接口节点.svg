<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a988f"/></marker></defs>
<rect width="760" height="392" fill="#ffffff"/>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d" text-anchor="start">接口节点 = 与 ROS 无关的状态机核心 + 可替换的后端；mock 与真实系统共用核心</text>
<rect x="24" y="72" width="200" height="200" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="124" y="96" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">ROS 适配层</text>
<text x="124" y="112" font-size="11.5" fill="#6b6a66" text-anchor="middle">rclpy 节点</text>
<text x="124" y="144" font-size="11.5" fill="#1f1e1d" text-anchor="middle">6 个 Service 回调</text>
<text x="124" y="164" font-size="11.5" fill="#1f1e1d" text-anchor="middle">SystemState 发布（2 Hz）</text>
<text x="124" y="184" font-size="11.5" fill="#1f1e1d" text-anchor="middle">订阅 rosbridge 客户端数</text>
<text x="124" y="216" font-size="11.5" fill="#1f1e1d" text-anchor="middle">多线程执行器</text>
<text x="124" y="236" font-size="11.5" fill="#1f1e1d" text-anchor="middle">急停使用独立回调组</text>
<rect x="264" y="72" width="232" height="200" rx="8" fill="#e3ecfa" stroke="#2f6fd6" stroke-width="2"/>
<text x="380" y="96" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">状态机核心</text>
<text x="380" y="112" font-size="11.5" fill="#6b6a66" text-anchor="middle">纯 Python，不依赖 ROS</text>
<text x="380" y="144" font-size="11.5" fill="#1f1e1d" text-anchor="middle">phase 迁移 · 指令校验</text>
<text x="380" y="164" font-size="11.5" fill="#1f1e1d" text-anchor="middle">旧数据保留与回退</text>
<text x="380" y="184" font-size="11.5" fill="#1f1e1d" text-anchor="middle">seq · session_id · last_result</text>
<text x="380" y="204" font-size="11.5" fill="#1f1e1d" text-anchor="middle">告警 · 激光自动关闭规则</text>
<rect x="536" y="72" width="200" height="56" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="636" y="96" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">后端接口 Backend</text>
<text x="636" y="112" font-size="11.5" fill="#6b6a66" text-anchor="middle">扫描 · 规划 · 任务 · 激光 · 急停</text>
<rect x="536" y="152" width="92" height="56" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="582" y="176" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">Mock 后端</text>
<text x="582" y="192" font-size="11.5" fill="#6b6a66" text-anchor="middle">假数据</text>
<rect x="644" y="152" width="92" height="56" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="690" y="176" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">真实后端</text>
<text x="690" y="192" font-size="11.5" fill="#6b6a66" text-anchor="middle">服务端实现</text>
<rect x="644" y="232" width="92" height="40" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="690" y="257" font-size="11.5" fill="#1f1e1d" text-anchor="middle">现有模块</text>
<rect x="24" y="304" width="200" height="56" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="124" y="328" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">调用日志</text>
<text x="124" y="344" font-size="11.5" fill="#6b6a66" text-anchor="middle">每次 Service 调用一行 JSON</text>
<rect x="264" y="304" width="232" height="56" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="380" y="328" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">文件导出</text>
<text x="380" y="344" font-size="11.5" fill="#6b6a66" text-anchor="middle">GLB（pygltflib）· 规划 JSON</text>
<rect x="536" y="304" width="200" height="56" rx="8" fill="none" stroke="#9a988f" stroke-width="1.25"/>
<text x="636" y="328" font-size="13" font-weight="600" fill="#1f1e1d" text-anchor="middle">文件目录</text>
<text x="636" y="344" font-size="11.5" fill="#6b6a66" text-anchor="middle">由 nginx 对外提供</text>
<path d="M224 172 L264 172" fill="none" stroke="#9a988f" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M496 100 L536 100" fill="none" stroke="#9a988f" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M582 128 L582 152" fill="none" stroke="#9a988f" stroke-width="1.25" marker-start="url(#arrow)"/>
<path d="M690 128 L690 152" fill="none" stroke="#9a988f" stroke-width="1.25" marker-start="url(#arrow)"/>
<path d="M690 208 L690 232" fill="none" stroke="#9a988f" stroke-width="1.25" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M380 272 L380 304" fill="none" stroke="#9a988f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M496 332 L536 332" fill="none" stroke="#9a988f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M124 272 L124 304" fill="none" stroke="#9a988f" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="604" y="144" font-size="11.5" fill="#6b6a66" text-anchor="start">实现</text>
</svg>
