# 文件服务，与服务端对接接口文档 14.3 一致
server {
    listen 8080;
    root /var/lib/spatialview/files;
    autoindex off;

    add_header Access-Control-Allow-Origin * always;
    gzip on;
    gzip_types application/json;

    location /models/ { types { } default_type model/gltf-binary; }
    location /plans/  { types { } default_type application/json; }
}
