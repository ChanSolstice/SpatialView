# 开发用服务端环境（架构设计 8.1）：rosbridge、mock 服务端、模拟驱动、nginx。
#
#   docker compose -f deploy/docker-compose.dev.yml up --build -d
#   docker compose -f deploy/docker-compose.dev.yml restart mock      # 模拟服务端程序重启
#   docker compose -f deploy/docker-compose.dev.yml stop driver       # 模拟机械臂驱动离线
#
# 环境变量：SAMPLE_SIZE（small、large 或 demo，默认 small）、MOCK_SPEED（加速倍率，默认 1）、ROS_DOMAIN_ID（默认 0）、
# ROSBRIDGE_PORT、HTTP_PORT（本机端口，默认 9090、8080）。
# APP 连接 ws://<本机>:9090 和 http://<本机>:8080。
name: spatialview-dev

x-ros: &ros
  build:
    context: ..
    dockerfile: deploy/dev/Dockerfile
  image: spatialview-dev
  init: true
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  restart: unless-stopped

services:
  driver:
    <<: *ros
    command:
      - /ws/ros2_ws/install/spatialview_mock/lib/spatialview_mock/driver_sim
      - --ros-args
      - -p
      - latch_file:=/var/lib/spatialview/driver/estop_latched
    volumes:
      - driver:/var/lib/spatialview/driver

  mock:
    <<: *ros
    command:
      - /ws/ros2_ws/install/spatialview_mock/lib/spatialview_mock/mock_server
      - --ros-args
      - -p
      - sample_dir:=/ws/samples/${SAMPLE_SIZE:-small}
      - -p
      - files_dir:=/var/lib/spatialview/files
      - -p
      - speed:=${MOCK_SPEED:-1.0}
    volumes:
      - files:/var/lib/spatialview/files

  rosbridge:
    <<: *ros
    command: [ros2, launch, /ws/deploy/rosbridge.launch.py, dev:=true]
    ports:
      - '${ROSBRIDGE_PORT:-9090}:9090'

  nginx:
    image: nginx:1.30.5-alpine
    volumes:
      - ./nginx/spatialview.conf:/etc/nginx/conf.d/default.conf:ro
      - files:/var/lib/spatialview/files:ro
    ports:
      - '${HTTP_PORT:-8080}:8080'
    restart: unless-stopped

volumes:
  files:
  driver:
